<!DOCTYPE html>
<html>
<head>
    <title>Почтовый голубь</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --primary: #4a90e2; --bg: #f0f2f5; --white: #fff; --gray: #888; --danger: #ff4d4d; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* Layout */
        #app { display: flex; height: 100%; max-width: 1200px; margin: 0 auto; background: var(--white); box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: var(--white); padding: 40px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn-link { background: none; color: var(--primary); margin-top: 10px; display: inline-block; cursor: pointer; }

        /* Sidebar */
        #sidebar { width: 320px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fdfdfd; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .my-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .tabs { display: flex; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 0.9em; color: var(--gray); }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        #search-wrap { padding: 10px; }
        #contact-list { flex: 1; overflow-y: auto; }
        .contact { padding: 10px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .contact:hover { background: #f5f5f5; }
        .contact.active { background: #eef5fc; }
        .contact img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-name { font-weight: bold; font-size: 0.95em; }
        .contact-desc { font-size: 0.8em; color: var(--gray); }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; position: relative; }
        #chat-header { padding: 15px; background: var(--white); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ddd; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 5px; }
        
        .msg { max-width: 60%; padding: 8px 12px; border-radius: 12px; position: relative; font-size: 0.95em; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.mine { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--white); border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 0.75em; color: var(--primary); font-weight: bold; margin-bottom: 2px; display: block; }
        .msg-time { font-size: 0.7em; color: #999; float: right; margin-left: 10px; margin-top: 5px; }
        .delete-btn { display: none; position: absolute; top: -10px; right: -10px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 12px; cursor: pointer; }
        .msg:hover .delete-btn { display: block; } /* Показать кнопку удаления при наведении */

        #input-area { padding: 15px; background: var(--white); display: flex; gap: 10px; align-items: center; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 400px; }
        .modal-header { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; color: var(--gray); }
        
        /* Utils */
        .hidden { display: none !important; }
        .avatar-upload { width: 100px; height: 100px; border-radius: 50%; background: #eee; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; border: 2px dashed #ccc; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход</h2>
            <input type="text" id="login-user" placeholder="Логин (Username)">
            <input type="password" id="login-pass" placeholder="Пароль">
            <button class="btn" onclick="authAction()">Полетели!</button>
            <span class="btn-link" onclick="toggleAuth()">Нет аккаунта? Создать</span>
            <p id="auth-error" style="color:red; font-size:0.9em; margin-top:10px;"></p>
        </div>
    </div>

    <div id="app" class="hidden">
        
        <div id="sidebar">
            <div class="sidebar-header" onclick="openProfileModal()">
                <img src="" id="my-mini-avatar" class="my-avatar">
                <div>
                    <div id="my-display-name" style="font-weight: bold;"></div>
                    <div style="font-size: 0.8em; color: #888;">Мой профиль</div>
                </div>
            </div>
            
            <div id="search-wrap">
                <input type="text" id="search-input" placeholder="Поиск людей и каналов..." oninput="doSearch()">
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('chats')">Чаты</div>
                <div class="tab" onclick="switchTab('create')">+ Создать</div>
            </div>

            <div id="contact-list">
                </div>
            
            <div id="create-panel" class="hidden" style="padding: 20px;">
                <h3>Создать новое</h3>
                <input type="text" id="new-comm-name" placeholder="Название (англ, без пробелов)">
                <select id="new-comm-type" style="width: 100%; padding: 10px; margin: 10px 0;">
                    <option value="group">Закрытая Группа</option>
                    <option value="channel">Публичный Канал</option>
                </select>
                <button class="btn" onclick="createCommunity()">Создать</button>
            </div>
        </div>

        <div id="chat-area">
            <div id="chat-header">
                <img src="" id="curr-chat-avatar" style="width:35px; height:35px; border-radius:50%;">
                <span id="curr-chat-name" style="font-weight: bold;">Выберите чат</span>
            </div>
            
            <div id="messages"></div>
            
            <div id="input-area" class="hidden">
                <input type="text" id="msg-input" placeholder="Напишите сообщение...">
                <button class="btn" style="width: auto;" onclick="sendMessage()">➤</button>
            </div>
            <div id="cant-write-msg" style="padding: 20px; text-align: center; color: #888;" class="hidden">
                Только владелец может писать в этот канал.
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Редактировать профиль</span>
                <span class="close-modal" onclick="closeModal()">✕</span>
            </div>
            <div class="avatar-upload" onclick="document.getElementById('file-upload').click()">
                <img id="edit-avatar-preview" src="">
                <input type="file" id="file-upload" hidden accept="image/*" onchange="encodeImageFileAsURL(this)">
            </div>
            <input type="text" id="edit-display-name" placeholder="Ваше имя (Display Name)">
            <input type="text" id="edit-bio" placeholder="О себе">
            <button class="btn" onclick="saveProfile()">Сохранить</button>
            <button class="btn" style="background:#ff4d4d; margin-top:5px;" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://potobsq-golub-1.onrender.com"; // <-- ТВОЯ ССЫЛКА
        const socket = io(SERVER_URL);

        let user = null; 
        let currentChatId = null;
        let isReg = false;

        // --- AUTH ---
        function toggleAuth() {
            isReg = !isReg;
            document.getElementById('auth-title').innerText = isReg ? "Регистрация" : "Вход";
            document.querySelector('.btn').innerText = isReg ? "Создать аккаунт" : "Войти";
            document.querySelector('.btn-link').innerText = isReg ? "Уже есть аккаунт? Вход" : "Нет аккаунта? Создать";
        }

        function authAction() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(!u || !p) return;
            socket.emit(isReg ? 'register' : 'login', {username: u, password: p});
        }

        socket.on('auth_response', (data) => {
            if(data.success) {
                user = data.user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                updateMyProfileUI();
                
                // Авто-вход в глобальный чат (пример)
                // loadChat('global'); 
            } else {
                document.getElementById('auth-error').innerText = data.message;
            }
        });

        // --- PROFILE ---
        function updateMyProfileUI() {
            document.getElementById('my-mini-avatar').src = user.avatar;
            document.getElementById('my-display-name').innerText = user.display_name;
            // Для модалки
            document.getElementById('edit-avatar-preview').src = user.avatar;
            document.getElementById('edit-display-name').value = user.display_name;
            document.getElementById('edit-bio').value = user.bio;
        }

        function openProfileModal() { document.getElementById('profile-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('profile-modal').style.display = 'none'; }
        
        // Конвертация картинки в Base64
        function encodeImageFileAsURL(element) {
            let file = element.files[0];
            let reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('edit-avatar-preview').src = reader.result;
            }
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const newName = document.getElementById('edit-display-name').value;
            const newBio = document.getElementById('edit-bio').value;
            const newAvatar = document.getElementById('edit-avatar-preview').src;
            
            socket.emit('update_profile', {
                username: user.username,
                display_name: newName,
                bio: newBio,
                avatar: newAvatar
            });
            closeModal();
        }

        socket.on('profile_updated', (data) => {
            user = data;
            updateMyProfileUI();
        });

        function logout() {
            location.reload();
        }

        // --- TABS & SEARCH ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if(tab === 'create') {
                document.getElementById('contact-list').classList.add('hidden');
                document.getElementById('create-panel').classList.remove('hidden');
            } else {
                document.getElementById('contact-list').classList.remove('hidden');
                document.getElementById('create-panel').classList.add('hidden');
            }
        }

        function doSearch() {
            const q = document.getElementById('search-input').value;
            if(q.length > 0) socket.emit('search', {query: q, user: user.username});
            else document.getElementById('contact-list').innerHTML = '';
        }

        socket.on('search_results', (results) => {
            const list = document.getElementById('contact-list');
            list.innerHTML = '';
            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'contact';
                div.onclick = () => {
                    if(item.type === 'user') openChat(item.id, item.name, item.avatar);
                    else joinCommunity(item.name);
                };
                div.innerHTML = `
                    <img src="${item.avatar}">
                    <div class="contact-info">
                        <span class="contact-name">${item.name} ${item.type === 'channel' ? '📢' : ''}</span>
                        <span class="contact-desc">${item.type}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        });

        // --- COMMUNITIES ---
        function createCommunity() {
            const name = document.getElementById('new-comm-name').value;
            const type = document.getElementById('new-comm-type').value;
            if(name) socket.emit('create_community', {name, type, owner: user.username});
        }

        socket.on('community_created', (data) => {
            if(data.success) {
                alert('Создано!');
                joinCommunity(data.name);
            } else alert(data.message);
        });

        function joinCommunity(name) {
            socket.emit('join_community', {name: name, user: user.username});
        }

        socket.on('join_response', (data) => {
            if(data.success) {
                openChat(data.name, data.name, "https://cdn-icons-png.flaticon.com/512/1256/1256650.png");
            } else {
                alert(data.message);
            }
        });

        // --- CHAT LOGIC ---
        function openChat(id, name, avatar) {
            currentChatId = id;
            document.getElementById('curr-chat-name').innerText = name;
            document.getElementById('curr-chat-avatar').src = avatar;
            document.getElementById('messages').innerHTML = 'Загрузка...';
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('cant-write-msg').classList.add('hidden');
            
            socket.emit('get_history', {chat_with: id, user: user.username});
        }

        socket.on('history_data', (data) => {
            if(data.chat !== currentChatId) return;
            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            data.messages.forEach(msg => addMessage(msg, data.is_owner));
            box.scrollTop = box.scrollHeight;

            if(!data.can_write) {
                document.getElementById('input-area').classList.add('hidden');
                document.getElementById('cant-write-msg').classList.remove('hidden');
            }
        });

        function sendMessage() {
            const txt = document.getElementById('msg-input').value;
            if(!txt) return;
            socket.emit('send_message', {sender: user.username, receiver: currentChatId, text: txt});
            document.getElementById('msg-input').value = '';
        }

        socket.on('new_message', (msg) => {
            if(msg.receiver === currentChatId || msg.from === currentChatId || (msg.receiver === user.username && msg.from === currentChatId)) {
                // Пытаемся определить, я владелец или нет (упрощенно: в реалтайме считаем что нет, пока не перезагрузим, или передаем в сокете)
                addMessage(msg, false); 
                const box = document.getElementById('messages');
                box.scrollTop = box.scrollHeight;
            } else {
                // Тут можно сделать уведомление (красная точка)
                // alert(`Новое сообщение от ${msg.from}`);
            }
        });
        
        // Уведомления
        socket.on('notification', (data) => {
            if (Notification.permission === "granted") {
                new Notification(data.text);
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") new Notification(data.text);
                });
            }
        });

        function addMessage(msg, amIOwner) {
            const isMine = msg.from === user.username;
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
            div.id = `msg-${msg.id}`;
            
            let deleteHtml = '';
            if (isMine || amIOwner) {
                deleteHtml = `<div class="delete-btn" onclick="deleteMsg(${msg.id})">✖</div>`;
            }

            div.innerHTML = `
                ${deleteHtml}
                <img src="${msg.sender_avatar}" style="width:20px; height:20px; border-radius:50%; float:left; margin-right:5px;">
                <span class="msg-sender">${msg.sender_display}</span>
                ${msg.text}
                <span class="msg-time">${msg.time}</span>
            `;
            document.getElementById('messages').appendChild(div);
        }

        function deleteMsg(id) {
            if(confirm('Удалить сообщение?')) {
                socket.emit('delete_message', {id: id, user: user.username});
            }
        }

        socket.on('message_deleted', (data) => {
            if(data.chat === currentChatId) {
                const el = document.getElementById(`msg-${data.id}`);
                if(el) el.remove();
            }
        });

        // Enter to send
        document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage();});

    </script>
</body>
</html>
