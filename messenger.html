<!DOCTYPE html>
<html>
<head>
    <title>Почтовый голубь</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --primary: #4a90e2; --bg: #f0f2f5; --white: #fff; --gray: #888; --danger: #ff4d4d; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #app { display: flex; height: 100%; max-width: 1200px; margin: 0 auto; background: var(--white); box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: var(--white); padding: 40px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn-link { background: none; color: var(--primary); margin-top: 10px; display: inline-block; cursor: pointer; border: none; }

        /* Sidebar */
        #sidebar { width: 320px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fdfdfd; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .sidebar-header:hover { background: #f5f5f5; }
        .my-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        
        #search-wrap { padding: 10px; border-bottom: 1px solid #eee; }
        #contact-list { flex: 1; overflow-y: auto; }
        .contact { padding: 10px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .contact:hover { background: #f5f5f5; }
        .contact.active { background: #eef5fc; }
        .contact img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-name { font-weight: bold; font-size: 0.95em; }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; position: relative; }
        #chat-header { padding: 15px; background: var(--white); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ddd; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 5px; }
        
        .msg { max-width: 60%; padding: 8px 12px; border-radius: 12px; position: relative; font-size: 0.95em; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--white); border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 0.75em; color: var(--primary); font-weight: bold; margin-bottom: 2px; display: block; }
        .msg-time { font-size: 0.7em; color: #999; float: right; margin-left: 10px; margin-top: 5px; }
        
        .delete-btn { display: none; position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 18px; font-size: 12px; cursor: pointer; border: 1px solid white; }
        .msg.mine:hover .delete-btn { display: block; } /* Показывать крестик только на своих сообщениях */

        #input-area { padding: 15px; background: var(--white); display: flex; gap: 10px; align-items: center; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 400px; text-align: center; }
        .modal-header { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; color: var(--gray); font-size: 1.2em; }
        
        .hidden { display: none !important; }
        .avatar-upload { width: 120px; height: 120px; border-radius: 50%; background: #eee; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; border: 2px dashed #ccc; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход</h2>
            <input type="text" id="login-user" placeholder="Логин (Английскими буквами)">
            <input type="password" id="login-pass" placeholder="Пароль">
            <button class="btn" onclick="authAction()">Влететь в чат</button>
            <button class="btn-link" onclick="toggleAuth()">Нет аккаунта? Создать</button>
            <p id="auth-error" style="color:red; font-size:0.9em; margin-top:10px;"></p>
        </div>
    </div>

    <div id="app" class="hidden">
        
        <div id="sidebar">
            <div class="sidebar-header" onclick="openProfileModal()">
                <img src="" id="my-mini-avatar" class="my-avatar">
                <div>
                    <div id="my-display-name" style="font-weight: bold;"></div>
                    <div style="font-size: 0.8em; color: var(--primary);">Настройки профиля</div>
                </div>
            </div>
            
            <div id="search-wrap">
                <input type="text" id="search-input" placeholder="Поиск друзей..." oninput="doSearch()">
            </div>

            <div id="contact-list">
                <div class="contact" onclick="openChat('global', '🌍 Глобальный чат', 'https://cdn-icons-png.flaticon.com/512/1055/1055666.png')">
                    <img src="https://cdn-icons-png.flaticon.com/512/1055/1055666.png">
                    <div class="contact-info">
                        <span class="contact-name">🌍 Глобальный чат</span>
                    </div>
                </div>
                <div id="search-results"></div>
            </div>
        </div>

        <div id="chat-area">
            <div id="chat-header">
                <img src="https://cdn-icons-png.flaticon.com/512/1055/1055666.png" id="curr-chat-avatar" style="width:40px; height:40px; border-radius:50%; object-fit: cover;">
                <span id="curr-chat-name" style="font-weight: bold; font-size: 1.1em;">Глобальный чат</span>
            </div>
            
            <div id="messages"></div>
            
            <div id="input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение...">
                <button class="btn" style="width: 50px; margin-top: 0;" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Мой профиль</span>
                <span class="close-modal" onclick="closeModal()">✖</span>
            </div>
            <p style="font-size: 0.8em; color: #888; margin-top: 0;">Нажми на фото, чтобы изменить</p>
            <div class="avatar-upload" onclick="document.getElementById('file-upload').click()">
                <img id="edit-avatar-preview" src="">
                <input type="file" id="file-upload" hidden accept="image/*" onchange="encodeImageFileAsURL(this)">
            </div>
            <input type="text" id="edit-display-name" placeholder="Отображаемое имя (Никнейм)">
            <input type="text" id="edit-bio" placeholder="Статус / О себе">
            <button class="btn" onclick="saveProfile()">Сохранить</button>
            <button class="btn" style="background: var(--danger); margin-top:10px;" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <script>
        // ВАЖНО: ВСТАВЬ СВОЮ ССЫЛКУ С RENDER СЮДА
        const SERVER_URL = "https://potobsq-golub-1.onrender.com"; 
        const socket = io(SERVER_URL);

        let user = null; 
        let currentChatId = 'global';
        let isReg = false;

        // --- АВТОВХОД (LocalStorage) ---
        window.onload = function() {
            // Запрашиваем разрешение на уведомления сразу при загрузке
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            const savedUser = localStorage.getItem('pigeon_user');
            const savedPass = localStorage.getItem('pigeon_pass');
            if(savedUser && savedPass) {
                document.getElementById('login-user').value = savedUser;
                document.getElementById('login-pass').value = savedPass;
                socket.emit('login', {username: savedUser, password: savedPass});
            }
        };

        // --- AUTH ---
        function toggleAuth() {
            isReg = !isReg;
            document.getElementById('auth-title').innerText = isReg ? "Регистрация" : "Вход";
            document.querySelector('.auth-box .btn').innerText = isReg ? "Создать аккаунт" : "Влететь в чат";
            document.querySelector('.btn-link').innerText = isReg ? "Уже есть аккаунт? Вход" : "Нет аккаунта? Создать";
        }

        function authAction() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(!u || !p) return;
            socket.emit(isReg ? 'register' : 'login', {username: u, password: p});
        }

        socket.on('auth_response', (data) => {
            if(data.success) {
                user = data.user;
                // Сохраняем данные для автовхода
                localStorage.setItem('pigeon_user', document.getElementById('login-user').value);
                localStorage.setItem('pigeon_pass', document.getElementById('login-pass').value);
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                updateMyProfileUI();
                
                socket.emit('join_global');
                openChat('global', '🌍 Глобальный чат', 'https://cdn-icons-png.flaticon.com/512/1055/1055666.png');
            } else {
                document.getElementById('auth-error').innerText = data.message;
            }
        });

        function logout() {
            localStorage.removeItem('pigeon_user');
            localStorage.removeItem('pigeon_pass');
            location.reload();
        }

        // --- ПРОФИЛЬ ---
        function updateMyProfileUI() {
            document.getElementById('my-mini-avatar').src = user.avatar;
            document.getElementById('my-display-name').innerText = user.display_name;
            document.getElementById('edit-avatar-preview').src = user.avatar;
            document.getElementById('edit-display-name').value = user.display_name;
            document.getElementById('edit-bio').value = user.bio;
        }

        function openProfileModal() { document.getElementById('profile-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('profile-modal').style.display = 'none'; }
        
        function encodeImageFileAsURL(element) {
            let file = element.files[0];
            let reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('edit-avatar-preview').src = reader.result;
            }
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            socket.emit('update_profile', {
                username: user.username,
                display_name: document.getElementById('edit-display-name').value,
                bio: document.getElementById('edit-bio').value,
                avatar: document.getElementById('edit-avatar-preview').src
            });
            closeModal();
        }

        socket.on('profile_updated', (data) => {
            user = data;
            updateMyProfileUI();
        });

        // --- ПОИСК ---
        function doSearch() {
            const q = document.getElementById('search-input').value;
            if(q.length > 0) socket.emit('search', {query: q, user: user.username});
            else document.getElementById('search-results').innerHTML = '';
        }

        socket.on('search_results', (results) => {
            const list = document.getElementById('search-results');
            list.innerHTML = '';
            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'contact';
                // При клике сразу открываем ЛС с этим пользователем
                div.onclick = () => openChat(item.id, item.name, item.avatar);
                div.innerHTML = `
                    <img src="${item.avatar}">
                    <div class="contact-info">
                        <span class="contact-name">${item.name}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        });

        // --- ЧАТ ---
        function openChat(id, name, avatar) {
            currentChatId = id;
            document.getElementById('curr-chat-name').innerText = name;
            document.getElementById('curr-chat-avatar').src = avatar;
            document.getElementById('messages').innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Загрузка сообщений...</div>';
            
            socket.emit('get_history', {chat_with: id, user: user.username});
        }

        socket.on('history_data', (data) => {
            if(data.chat !== currentChatId) return;
            const box = document.getElementById('messages');
            box.innerHTML = '';
            data.messages.forEach(msg => addMessage(msg));
            box.scrollTop = box.scrollHeight;
        });

        function sendMessage() {
            const txt = document.getElementById('msg-input').value;
            if(!txt) return;
            socket.emit('send_message', {sender: user.username, receiver: currentChatId, text: txt});
            document.getElementById('msg-input').value = '';
        }

        socket.on('new_message', (msg) => {
            // Показываем сообщение, если мы находимся в нужном чате
            if(msg.receiver === currentChatId || msg.from === currentChatId || (msg.receiver === user.username && msg.from === currentChatId)) {
                addMessage(msg); 
                const box = document.getElementById('messages');
                box.scrollTop = box.scrollHeight;
            }
        });
        
        // Уведомления (если чат свернут)
        socket.on('notification', (data) => {
            if (Notification.permission === "granted" && document.hidden) {
                new Notification(`Почтовый голубь: ${data.from}`, { body: data.text, icon: 'https://cdn-icons-png.flaticon.com/512/1055/1055666.png' });
            }
        });

        function addMessage(msg) {
            const isMine = msg.from === user.username;
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
            div.id = `msg-${msg.id}`;
            
            // Крестик только на своих сообщениях
            let deleteHtml = isMine ? `<div class="delete-btn" onclick="deleteMsg(${msg.id})">✖</div>` : '';

            div.innerHTML = `
                ${deleteHtml}
                <img src="${msg.sender_avatar}" style="width:22px; height:22px; border-radius:50%; float:left; margin-right:8px; object-fit: cover;">
                <span class="msg-sender">${msg.sender_display}</span>
                ${msg.text}
                <span class="msg-time">${msg.time}</span>
                <div style="clear: both;"></div>
            `;
            document.getElementById('messages').appendChild(div);
        }

        function deleteMsg(id) {
            if(confirm('Удалить это сообщение?')) {
                socket.emit('delete_message', {id: id, user: user.username});
            }
        }

        socket.on('message_deleted', (data) => {
            if(data.chat === currentChatId || data.chat === 'global') {
                const el = document.getElementById(`msg-${data.id}`);
                if(el) el.remove();
            }
        });

        // Отправка по Enter
        document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage();});

    </script>
</body>
</html>
